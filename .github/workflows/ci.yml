name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Tea
        uses: actions/checkout@v4

      - name: Checkout Hydro
        uses: actions/checkout@v4
        with:
          repository: haasele/hydro
          path: hydro-src

      - name: Link Hydro as sibling
        run: ln -sfn "$GITHUB_WORKSPACE/hydro-src" ../hydro

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tea-${{ hashFiles('Cargo.lock') }}

      - name: Verify
        run: ./scripts/verify.sh
